name: vectors
# The vendored test vectors must match the ones qubesync.com serves (mix
# webhook_vectors.gen in qube), so a change to how the server signs or what it
# sends fails here; likewise the vendored operations manifest (mix
# library_operations.gen), which operations/ is generated from. Weekly too, so
# it's caught without a pull request.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test/fixtures/test_vectors.json matches https://qubesync.com/webhooks/test_vectors.json
        run: |
          url=https://qubesync.com/webhooks/test_vectors.json
          status=$(curl -sS -o served.json -w '%{http_code}' "$url")
          if [ "$status" = 404 ]; then
            echo "::warning::$url isn't served yet; skipped"
            exit 0
          fi
          if [ "$status" != 200 ]; then
            echo "::error::GET $url answered $status"
            exit 1
          fi
          if ! cmp -s served.json test/fixtures/test_vectors.json; then
            echo "::error::test/fixtures/test_vectors.json differs from $url: copy the served file over it and rerun the tests"
            diff test/fixtures/test_vectors.json served.json | head -40
            exit 1
          fi
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The 404 allowance goes once qubesync.com serves /libraries/operations.json (qube 312d8290 is
      # deployed): after that a 404 fails like any other difference.
      - name: test/fixtures/operations.json matches https://qubesync.com/libraries/operations.json
        run: |
          url=https://qubesync.com/libraries/operations.json
          status=$(curl -sS -o served.json -w '%{http_code}' "$url")
          if [ "$status" = 404 ]; then
            echo "::warning::$url isn't served yet (404); skipped"
            exit 0
          fi
          if [ "$status" != 200 ]; then
            echo "::error::GET $url answered $status"
            exit 1
          fi
          if ! cmp -s served.json test/fixtures/operations.json; then
            echo "::error::test/fixtures/operations.json differs from $url: copy the served file over it, run node scripts/generate-operations.js, and rerun the tests"
            diff test/fixtures/operations.json served.json | head -40
            exit 1
          fi
