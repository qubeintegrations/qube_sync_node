name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["16", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: operations/ matches test/fixtures/operations.json
        run: node scripts/generate-operations.js --check
      - if: matrix.node == '22'
        run: npm run test:types
      - if: matrix.node == '22'
        run: npm pack --dry-run
